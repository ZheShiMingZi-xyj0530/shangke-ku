<!DOCTYPE html>
import turtle
import random

turtle.speed(0)
turtle.bgcolor("black")
colors = ["red", "blue", "green", "yellow", "purple", "orange"]

for i in range(360):
    turtle.pencolor(colors[i % len(colors)])
    turtle.width(i / 100 + 1)
    turtle.forward(i)
    turtle.left(59)

turtle.done()
